; ROOM.INI - the game T_ROOM plays. Change it and run T_ROOM again: no build.
;
; [GAME] names the first room (START) and every room in the order the next
; one is looked for (ORDER). Every other [SECTION] is a room:
;   TITLE  its name, top left        WALL, FLOOR  colours 0..255 (0..15 EGA)
;   ITEM NAME = x,y   a thing: NAME is a kind T_ROOM has a picture for
;                     (KEY LAMP BOOK FEATHER CANDLE), x,y its top left;
;                     the room is 320 x 160, the panel below it
;   TEXT NAME = ...   the caption when it is taken (up to 38 letters)
;   NEED = NAMES      what must be taken to leave (none: everything)
;   DONE = ...        said when the room is done
;   CODE = n          the room's exit code: the next room is the first in
;                     ORDER whose ENTERS holds n
;   ENDING = YES      the game ends after this room
; A value runs to the end of its line: no comment after it.

[GAME]
START = HALL
ORDER = HALL ATTIC
END   = THE OWL FLIES OUT INTO THE NIGHT.

[HALL]
TITLE = THE HALL
WALL  = 3
FLOOR = 8
ITEM KEY  = 100,130
ITEM LAMP = 160,98
ITEM BOOK = 250,120
TEXT KEY  = An old iron key. It is warm.
TEXT LAMP = The lamp still smells of oil.
TEXT BOOK = A book with no title.
NEED = KEY LAMP
DONE = The stair door opens.
CODE = 1

[ATTIC]
TITLE  = THE ATTIC
ENTERS = 1
WALL   = 5
FLOOR  = 6
ITEM FEATHER = 70,118
ITEM CANDLE  = 180,96
ITEM BOOK    = 262,126
TEXT FEATHER = A grey feather. An owl was here.
TEXT CANDLE  = Half burnt. Someone reads up here.
TEXT BOOK    = The same book. Its pages are blank.
DONE   = The window swings open.
CODE   = 2
ENDING = YES

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WIRE CITY 86</title>
<meta name="description" content="A DOS machine in your browser, with real files: our games, their sources, and the lessons that teach how they are made.">
<link rel="stylesheet" href="site.css">
</head>
<body>
<canvas id="screen"></canvas>
<!-- MOCKUP, 2026-10-16: the new WIRE CITY site, beside the live one
     (../index.html is not touched). The menu and the desktop only; every
     item says what it will do. The windows are OWLOSUI's (../owlosui/, a
     copy of its web library - see ../owlosui/README.md). -->
<script type="module">
  // The log first: it is listening for errors before anything can make one.
  import { catchThePage } from '../owlosui/apps/log.js';
  import { run } from '../owlosui/owlosui.js';
  catchThePage();
  import { SiteApp } from './site.js';
  run(document.getElementById('screen'), owl => {
    const app = new SiteApp(owl);
    window.site = app;
    app.track(app.start());
    return app;
  }).catch(e => { document.body.style.color = '#ccc'; document.body.textContent = String(e); });
</script>
</body>
</html>
